# Render Blueprint specification for Job Application Tracker Agent
# Documentation: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: job-tracker-agent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      # LLM Backend configuration:
      # Defaults to 'remote' for cloud deployment with OpenAI-compatible Groq API.
      - key: LLM_BACKEND
        value: remote
      - key: REMOTE_LLM_URL
        value: https://api.groq.com/openai/v1
      - key: REMOTE_LLM_MODEL
        value: openai/gpt-oss-20b
      # Managed securely in the Render dashboard:
      - key: REMOTE_LLM_API_KEY
        sync: false
      # Ephemeral demo storage: SQLite stores data in the local container filesystem.
      # NOTE: On Render Free tier, data resets when the instance spins down (after 15 min inactivity), restarts, or redeploys.
      # For permanent persistence without a 30-day drop, connect an external managed database (e.g. Neon PostgreSQL free tier).
      - key: DATABASE_URL
        value: sqlite:///./job_tracker.db
