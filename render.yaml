services:
  - type: web
    name: job-tracker-agent
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: LLM_BACKEND
        value: disabled
      - key: DATABASE_URL
        value: sqlite:///./job_tracker.db
